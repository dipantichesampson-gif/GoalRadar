name: Update GoalRadar football data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GoalRadar
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch fixtures and predictions
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python scripts/update_goalradar.py

      - name: Commit updated data
        run: |
          git config user.name "GoalRadar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/goalradar.json
          git diff --cached --quiet || git commit -m "Update GoalRadar football data"
          git push
